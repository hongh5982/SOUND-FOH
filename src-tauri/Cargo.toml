[package]
name = "sfoh"
version = "0.1.0"
description = "Sound FOH - speaker measurement and tuning for beginners"
edition = "2021"

[lib]
name = "sfoh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
